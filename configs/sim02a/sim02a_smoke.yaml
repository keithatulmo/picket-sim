# SMOKE configuration for automated tests only (coarse grids, candidate subset).
# Generated from sim02a_baseline.yaml by tools/make_sim02a_smoke.py. Not for engineering conclusions.
experiment:
  id: SIM-02A
  title: Sensor, noise and error modeling
  description: Fast smoke configuration (coarse grids, subset of candidates) for automated tests. Not for engineering use.
  assumptions:
  - Narrowband, far-field plane-wave signals in a homogeneous medium (as SIM-01), plus near-field point sources for host noise.
  - Ideal omnidirectional point hydrophones; per-channel errors are the only deviations from ideal elements.
  - Conventional uniformly weighted delay-and-sum; nominal positions and timing in the beamformer.
  - Sensor, ambient, host and error levels are assumed scenarios (provenance tagged); results are reported as ratios where
    possible.
  - Ambient noise spatial structure is modeled by unit-power fields; absolute ambient levels enter only the acquisition and
    dynamic-range analysis.
  - Channel errors are independent zero-mean Gaussian across channels and trials.
  - Planar candidates lie in the horizontal x-y plane; lines along x; volumetric envelopes extend downward (z negative).
