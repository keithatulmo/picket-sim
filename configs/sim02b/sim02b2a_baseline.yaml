experiment:
  id: SIM-02B.2-A
  title: SIM-02B.2-A adaptive noise estimation and false-alarm control
  assumptions:
  - Models, spectra, coherence, S1 chain and signal classes as SIM-02B.1 (ADR-0015 to ADR-0017).
  - Thresholds are fixed at design time from the nominal model (Wenz nominal, isotropic, S1, stationary); scenarios change
    the truth only (ADR-0019, ADR-0020).
  - Reference windows are independent windows of the same noise process; nonstationarity, interference and contamination enter
    only through the scenario definitions.
  - Stationary Gaussian noise inside every window; no host noise, calibration or synchronization errors (SIM-02B.2-B and -C).
